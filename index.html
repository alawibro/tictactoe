<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000428">
<meta name="color-scheme" content="dark">
<title>Tic Tac Toe dengan AI</title>
<style>
  :root {
    --bg: #000428;
    --bg-end: #004E92;
    --card: rgba(0, 12, 34, 0.42);
    --cell: rgba(255, 255, 255, 0.07);
    --line: rgba(255, 255, 255, 0.12);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --x: #38bdf8;
    --o: #f472b6;
    --accent: #22c55e;
    --win: #facc15;
    --radius: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  /* Warna cadangan saat overscroll di iOS/Android */
  html {
    background-color: var(--bg-end);
  }

  html, body {
    margin: 0;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation; /* tanpa jeda double-tap zoom */
  }

  /* Deep Sea: gradasi linear statis (tanpa animasi, hemat baterai & GPU) */
  body {
    background-color: var(--bg);
    background-image: linear-gradient(160deg, #000428 0%, #004E92 100%);
    background-repeat: no-repeat;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  main {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  h1 {
    margin: 8px 0 0;
    font-size: clamp(1.4rem, 6vw, 1.9rem);
    text-align: center;
  }
  .sub {
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: .95rem;
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .label {
    font-size: .85rem;
    color: var(--muted);
    margin-bottom: -4px;
  }

  /* Tombol: area sentuh minimal 48px */
  .btn {
    appearance: none;
    border: 0;
    border-radius: 12px;
    min-height: 48px;
    padding: 0 16px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    background: var(--line);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .08s ease, background-color .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: #052e16; }
  .btn.selected { outline: 3px solid var(--text); outline-offset: -3px; }
  .btn.x-pick { color: var(--x); }
  .btn.o-pick { color: var(--o); }
  .btn.selected.x-pick, .btn.selected.o-pick { color: var(--text); }
  .btn:focus-visible { outline: 3px solid var(--win); outline-offset: 2px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  .mode-btn { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; }
  .mode-btn small { font-weight: 400; color: var(--muted); font-size: .85rem; }
  .mode-btn.selected { background: rgba(255, 255, 255, 0.16); }

  input[type="text"] {
    width: 100%;
    min-height: 48px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: rgba(0, 0, 0, 0.28);
    color: var(--text);
    font: inherit;
    font-size: 16px; /* mencegah zoom otomatis di iOS */
    padding: 0 14px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  /* Status */
  .status {
    min-height: 3.2em;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.35;
  }

  /* Papan */
  .board {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
  }
  .cell {
    appearance: none;
    border: 0;
    border-radius: var(--radius);
    background: var(--cell);
    border: 1px solid rgba(255, 255, 255, 0.04);
    color: var(--text);
    font: inherit;
    font-size: clamp(2.6rem, 14vw, 4.6rem);
    font-weight: 800;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color .15s ease, transform .1s ease;
  }
  .cell:disabled { cursor: default; }
  .cell:not(:disabled):not(.x):not(.o):active { background: rgba(255, 255, 255, 0.14); transform: scale(.96); }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win { background: rgba(250, 204, 21, 0.16); color: var(--win); box-shadow: inset 0 0 0 3px var(--win); }
  .cell.pop { animation: pop .18s ease-out; }
  @keyframes pop {
    from { transform: scale(.6); opacity: .3; }
    to   { transform: scale(1); opacity: 1; }
  }

  .sound-btn {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: var(--text);
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
  }

  .turn-pill {
    align-self: center;
    font-size: .85rem;
    color: var(--muted);
  }

  .footer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Layar kecil: kurangi jarak agar papan tetap terlihat tanpa scroll */
  @media (max-height: 680px) {
    main { gap: 10px; }
    .card { padding: 12px; gap: 10px; }
    h1 { font-size: 1.3rem; margin-top: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tic Tac Toe dengan AI</h1>
    <p class="sub">Main sendiri, lawan teman, atau tonton dua komputer.</p>
  </header>

  <!-- ===== LAYAR PENGATURAN ===== -->
  <section id="setup" class="card">
    <div class="label">Pilih mode</div>
    <div class="stack" id="modes">
      <button class="btn mode-btn selected" data-mode="0">
        Lawan Komputer
        <small>Kamu melawan AI</small>
      </button>
      <button class="btn mode-btn" data-mode="1">
        2 Pemain
        <small>Main bergantian di satu layar</small>
      </button>
      <button class="btn mode-btn" data-mode="2">
        Komputer vs Komputer
        <small>Tonton dua AI bertanding</small>
      </button>
    </div>

    <div id="names" class="stack">
      <div class="label" id="p1-label">Nama Pemain 1</div>
      <input type="text" id="p1-name" maxlength="16" placeholder="Pemain 1" autocomplete="off" enterkeyhint="next">
      <div class="label" id="p2-label" hidden>Nama Pemain 2</div>
      <input type="text" id="p2-name" maxlength="16" placeholder="Pemain 2" autocomplete="off" enterkeyhint="done" hidden>
    </div>

    <div id="mark-box" class="stack">
      <div class="label" id="mark-label">Pilih X atau O</div>
      <div class="row">
        <button class="btn x-pick selected" data-mark="X">X</button>
        <button class="btn o-pick" data-mark="O">O</button>
      </div>
    </div>

    <button class="btn primary" id="start-btn">Mulai</button>
  </section>

  <!-- ===== LAYAR PERMAINAN ===== -->
  <section id="game" class="card" hidden>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="turn-pill" id="turn-pill"></div>

    <div class="board" id="board" role="grid" aria-label="Papan permainan"></div>

    <div class="footer-btns">
      <button class="btn primary" id="again-btn" hidden>Main lagi</button>
      <button class="btn" id="menu-btn">Ganti mode</button>
    </div>
  </section>
</main>

<button class="sound-btn" id="sound-btn" type="button" aria-label="Matikan suara">🔊</button>

  // ---------- Modul suara (Web Audio API) ----------
  var sfx = (function () {
    var ctx = null, buffers = {}, muted = false;

    function base64ToArrayBuffer(b64) {
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    function ensure() {
      if (ctx) return ctx;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      Object.keys(SFX_DATA).forEach(function (name) {
        ctx.decodeAudioData(base64ToArrayBuffer(SFX_DATA[name].split(',')[1]),
          function (buf) { buffers[name] = buf; },
          function () { /* abaikan: suara opsional */ });
      });
      return ctx;
    }

    return {
      // Dipanggil dari sentuhan pertama agar iOS/Android mengizinkan audio
      unlock: function () {
        var c = ensure();
        if (c && c.state === 'suspended') c.resume();
      },
      play: function (name) {
        if (muted) return;
        var c = ensure(), buf = buffers[name];
        if (!c || !buf) return;
        if (c.state === 'suspended') c.resume();
        var src = c.createBufferSource(), gain = c.createGain();
        gain.gain.value = 0.7;
        src.buffer = buf;
        src.connect(gain);
        gain.connect(c.destination);
        src.start();
      },
      // Dekode klip sejak awal (tidak perlu sentuhan), agar suara pertama langsung siap
      preload: function () { ensure(); },
      toggle: function () { muted = !muted; return muted; }
    };
  })();

  var WIN_LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  // Tombol keypad (7 8 9 / 4 5 6 / 1 2 3) dipetakan ke indeks papan 0-8
  var KEYPAD_TO_INDEX = { '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8 };

  var MODE_NAMES = ['Lawan Komputer', '2 Pemain', 'Komputer vs Komputer'];

  var $ = function (id) { return document.getElementById(id); };
  var setupEl = $('setup'), gameEl = $('game'), boardEl = $('board');
  var statusEl = $('status'), turnPill = $('turn-pill');
  var againBtn = $('again-btn'), menuBtn = $('menu-btn'), startBtn = $('start-btn');
  var p1Input = $('p1-name'), p2Input = $('p2-name');
  var p1Label = $('p1-label'), p2Label = $('p2-label');
  var markBox = $('mark-box'), markLabel = $('mark-label');

  var selectedMode = 0;
  var selectedMark = 'X';

  var game = null;   // keadaan permainan aktif
  var runId = 0;     // dipakai untuk membatalkan timer AI lama

  // ---------- Logika permainan ----------

  function winnerLine(board) {
    for (var i = 0; i < WIN_LINES.length; i++) {
      var l = WIN_LINES[i];
      if (board[l[0]] && board[l[0]] === board[l[1]] && board[l[0]] === board[l[2]]) {
        return l;
      }
    }
    return null;
  }

  function isFull(board) {
    for (var i = 0; i < 9; i++) if (board[i] === '') return false;
    return true;
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // Urutan AI: menang > blok lawan > tengah > sudut > sisi
  function pickAIMove(board, me) {
    var opp = me === 'X' ? 'O' : 'X';
    var empties = [];
    for (var i = 0; i < 9; i++) if (board[i] === '') empties.push(i);

    var marks = [me, opp];
    for (var m = 0; m < marks.length; m++) {
      for (var e = 0; e < empties.length; e++) {
        var trial = board.slice();
        trial[empties[e]] = marks[m];
        if (winnerLine(trial)) return empties[e];
      }
    }

    if (board[4] === '') return 4;

    var corners = [0, 2, 6, 8].filter(function (i) { return board[i] === ''; });
    if (corners.length) return pickRandom(corners);

    var edges = [1, 3, 5, 7].filter(function (i) { return board[i] === ''; });
    return pickRandom(edges);
  }

  // ---------- Pengaturan ----------

  function refreshSetup() {
    var mode = selectedMode;
    var isComputerOnly = mode === 2;
    var isVsPlayer = mode === 1;

    $('names').hidden = isComputerOnly;
    markBox.hidden = isComputerOnly;
    p2Label.hidden = !isVsPlayer;
    p2Input.hidden = !isVsPlayer;
    p1Label.textContent = mode === 0 ? 'Nama kamu' : 'Nama Pemain 1';
    markLabel.textContent = mode === 0 ? 'Kamu pakai X atau O?' : 'Pemain 1 pilih X atau O';
    p1Input.placeholder = mode === 0 ? 'Kamu' : 'Pemain 1';
  }

  function setActive(container, attr, value) {
    var buttons = container.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('selected', buttons[i].getAttribute(attr) === String(value));
    }
  }

  $('modes').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    selectedMode = Number(btn.getAttribute('data-mode'));
    setActive($('modes'), 'data-mode', selectedMode);
    refreshSetup();
  });

  markBox.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mark]');
    if (!btn) return;
    selectedMark = btn.getAttribute('data-mark');
    setActive(markBox, 'data-mark', selectedMark);
  });

  // ---------- Membuat permainan ----------

  function buildPlayers() {
    var myName = (p1Input.value || '').trim();
    var otherName = (p2Input.value || '').trim();
    var other = selectedMark === 'X' ? 'O' : 'X';

    if (selectedMode === 0) {
      return [
        { name: myName || 'Kamu', mark: selectedMark, ai: false },
        { name: 'Komputer', mark: other, ai: true }
      ];
    }
    if (selectedMode === 1) {
      return [
        { name: myName || 'Pemain 1', mark: selectedMark, ai: false },
        { name: otherName || 'Pemain 2', mark: other, ai: false }
      ];
    }
    return [
      { name: 'Komputer 1', mark: 'X', ai: true },
      { name: 'Komputer 2', mark: 'O', ai: true }
    ];
  }

  function startGame() {
    sfx.unlock();
    sfx.play('start');
    runId++;
    game = {
      id: runId,
      mode: selectedMode,
      players: buildPlayers(),
      board: ['', '', '', '', '', '', '', '', ''],
      turn: Math.random() < 0.5 ? 0 : 1, // siapa mulai dipilih acak, seperti versi Python
      over: false
    };

    setupEl.hidden = true;
    gameEl.hidden = false;
    againBtn.hidden = true;
    buildBoard();
    render();
    scheduleTurn();
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    for (var i = 0; i < 9; i++) {
      var cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.dataset.index = String(i);
      cell.setAttribute('role', 'gridcell');
      boardEl.appendChild(cell);
    }
  }

  function render() {
    var cells = boardEl.children;
    var winLine = game.winLine;
    var humanTurn = !game.over && !game.players[game.turn].ai;

    for (var i = 0; i < 9; i++) {
      var cell = cells[i];
      var mark = game.board[i];
      cell.textContent = mark;
      cell.className = 'cell' + (mark ? ' ' + mark.toLowerCase() : '');
      cell.disabled = !humanTurn;
      var label = mark ? 'Kotak ' + (i + 1) + ', ' + mark : 'Kotak ' + (i + 1) + ', kosong';
      cell.setAttribute('aria-label', label);
    }

    if (winLine) {
      for (var w = 0; w < winLine.length; w++) cells[winLine[w]].classList.add('win');
    }

    if (!game.over) {
      var p = game.players[game.turn];
      if (p.ai) {
        statusEl.textContent = p.name + ' sedang berpikir…';
      } else {
        statusEl.textContent = 'Giliran ' + p.name + ' (' + p.mark + ')';
      }
      turnPill.textContent = MODE_NAMES[game.mode];
    }
  }

  function scheduleTurn() {
    if (game.over) return;
    var p = game.players[game.turn];
    render();

    if (p.ai) {
      var myId = game.id;
      var delay = game.mode === 2 ? 550 : 450;
      setTimeout(function () {
        if (!game || game.id !== myId || game.over) return;
        var pos = pickAIMove(game.board, p.mark);
        playMove(pos);
      }, delay);
    }
  }

  function playMove(index) {
    if (game.over || game.board[index] !== '') return;

    var p = game.players[game.turn];
    game.board[index] = p.mark;

    if (navigator.vibrate && !p.ai) navigator.vibrate(10);

    var line = winnerLine(game.board);
    if (line) {
      game.over = true;
      game.winLine = line;
      render();
      sfx.play(p.ai && game.mode === 0 ? 'lose' : 'win');
      statusEl.textContent = endMessage(p, true);
      showEnd();
      return;
    }

    if (isFull(game.board)) {
      game.over = true;
      render();
      sfx.play('draw');
      statusEl.textContent = 'Seri! Papan penuh.';
      showEnd();
      return;
    }

    sfx.play('move');
    game.turn = 1 - game.turn;
    scheduleTurn();
  }

  function endMessage(p, won) {
    if (game.mode === 2) return p.name + ' menang!';
    if (game.mode === 0) {
      return p.ai ? 'Komputer menang. Coba lagi!' : 'Selamat ' + p.name + ', kamu menang! 🎉';
    }
    return 'Selamat ' + p.name + ' menang! 🎉';
  }

  function showEnd() {
    againBtn.hidden = false;
  }

  // ---------- Input ----------

  boardEl.addEventListener('click', function (e) {
    var cell = e.target.closest('.cell');
    if (!cell || !game || game.over) return;
    sfx.unlock();
    var p = game.players[game.turn];
    if (p.ai) return;
    var idx = Number(cell.dataset.index);
    if (game.board[idx] !== '') { sfx.play('invalid'); return; }
    playMove(idx);
  });

  // Dukungan keyboard (laptop): tombol 1-9 seperti keypad
  document.addEventListener('keydown', function (e) {
    if (!game || game.over || gameEl.hidden) return;
    if (game.players[game.turn].ai) return;
    var idx = KEYPAD_TO_INDEX[e.key];
    if (idx === undefined) return;
    if (game.board[idx] !== '') { sfx.play('invalid'); return; }
    playMove(idx);
  });

  againBtn.addEventListener('click', function () {
    if (!game) return;
    startGame();
  });

  menuBtn.addEventListener('click', function () {
    runId++; // batalkan timer AI yang sedang berjalan
    game = null;
    gameEl.hidden = true;
    setupEl.hidden = false;
    window.scrollTo(0, 0);
  });

  var soundBtn = $('sound-btn');
  soundBtn.addEventListener('click', function () {
    sfx.unlock();
    var muted = sfx.toggle();
    soundBtn.textContent = muted ? '🔇' : '🔊';
    soundBtn.setAttribute('aria-label', muted ? 'Nyalakan suara' : 'Matikan suara');
  });

  startBtn.addEventListener('click', function () {
    startGame();
  });

  // Enter di kolom nama langsung memulai
  [p1Input, p2Input].forEach(function (input) {
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (input === p1Input && !p2Input.hidden) p2Input.focus();
        else startGame();
      }
    });
  });

  sfx.preload();
  refreshSetup();
})();
</script>
</body>
</html>
